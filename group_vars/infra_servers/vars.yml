---
# -----------------------------------------------------------------------------
# Tailscale
# -----------------------------------------------------------------------------

# Make the homelab LAN reachable from devices connected to the tailnet.
tailscale_advertise_routes: "192.168.2.0/24"

# Allow this VM to be selected as a Tailscale exit node.
tailscale_advertise_exit_node: true


# -----------------------------------------------------------------------------
# AdGuard Home
# -----------------------------------------------------------------------------

adguardhome_bind_ip: "192.168.2.236"
# Migrate the persisted AdGuard listener configuration from the previous LAN.
adguardhome_previous_bind_ip: "192.168.2.212"
adguardhome_admin_username: "tuero"

adguardhome_dns_rewrites:

