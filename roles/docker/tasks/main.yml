---
- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts["distribution_release"] }}
      Components: stable
      Architectures: {{ docker_apt_arch }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    allow_downgrade: true
    update_cache: true

- name: Validate required Docker CIFS mounts
  ansible.builtin.assert:
    that:
      - item is string
      - item.startswith('/')
    fail_msg: "docker_required_cifs_mounts entries must be absolute paths"
  loop: "{{ docker_required_cifs_mounts }}"

- name: Install Docker storage readiness script
  ansible.builtin.template:
    src: wait-for-storage.sh.j2
    dest: /usr/local/sbin/docker-wait-for-storage
    owner: root
    group: root
    mode: "0755"

- name: Install Docker storage readiness service
  ansible.builtin.template:
    src: docker-storage-ready.service.j2
    dest: /etc/systemd/system/docker-storage-ready.service
    owner: root
    group: root
    mode: "0644"

- name: Create Docker systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Require storage readiness before Docker starts
  ansible.builtin.template:
    src: storage-ready.conf.j2
    dest: /etc/systemd/system/docker.service.d/storage-ready.conf
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd units for Docker storage readiness
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure containerd service is enabled and running
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Create Docker service directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"
  loop: "{{ docker_directories }}"

- name: Create shared reverse proxy network
  community.docker.docker_network:
    name: "{{ docker_proxy_network | default('proxy') }}"
    driver: bridge
    state: present
  tags: [proxy]
