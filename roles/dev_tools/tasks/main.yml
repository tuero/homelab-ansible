---
- name: Install GPU development packages
  ansible.builtin.apt:
    name: "{{ gpu_dev_packages }}"
    state: present

# ---------------- Rust ----------------

- name: Check whether rustup is installed
  ansible.builtin.stat:
    path: "{{ dev_home }}/.cargo/bin/rustup"
  register: rustup_binary

- name: Download rustup installer
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup-init.sh
    mode: "0755"
  when: not rustup_binary.stat.exists

- name: Install Rust for development user
  ansible.builtin.command:
    cmd: /tmp/rustup-init.sh -y
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  when: not rustup_binary.stat.exists

# ---------------- CMake + Neovim ----------------

- name: Remove Ubuntu CMake package because CMake will come from Snap
  ansible.builtin.apt:
    name: cmake
    state: absent
    purge: true

- name: Check CMake snap
  ansible.builtin.command: snap list cmake
  register: cmake_snap
  changed_when: false
  failed_when: false

- name: Install current CMake snap
  ansible.builtin.command: snap install cmake --classic
  when: cmake_snap.rc != 0

- name: Check Neovim snap
  ansible.builtin.command: snap list nvim
  register: nvim_snap
  changed_when: false
  failed_when: false

- name: Install current Neovim snap
  ansible.builtin.command: snap install nvim --classic
  when: nvim_snap.rc != 0

# ---------------- LLVM ----------------

- name: Install apt.llvm.org signing key
  ansible.builtin.get_url:
    url: https://apt.llvm.org/llvm-snapshot.gpg.key
    dest: /etc/apt/trusted.gpg.d/apt.llvm.org.asc
    mode: "0644"

- name: Configure apt.llvm.org for LLVM {{ llvm_version }}
  ansible.builtin.deb822_repository:
    name: apt-llvm
    types: deb
    uris: "https://apt.llvm.org/{{ ansible_facts['distribution_release'] }}/"
    suites: "llvm-toolchain-{{ ansible_facts['distribution_release'] }}-{{ llvm_version }}"
    components: main
    signed_by: /etc/apt/trusted.gpg.d/apt.llvm.org.asc
    state: present

- name: Check for LLDB from the previous LLVM release
  ansible.builtin.command:
    cmd: >-
      dpkg-query --show --showformat=${db:Status-Status}
      liblldb-{{ (llvm_version | int) - 1 }}
  register: previous_liblldb
  changed_when: false
  failed_when: false

- name: Remove conflicting LLDB packages from the previous LLVM release
  ansible.builtin.command:
    cmd: >-
      dpkg --remove --force-depends
      lldb-{{ (llvm_version | int) - 1 }}
      python3-lldb-{{ (llvm_version | int) - 1 }}
      liblldb-{{ (llvm_version | int) - 1 }}
  when: previous_liblldb.stdout == 'installed'

- name: Check for incomplete APT package installations
  ansible.builtin.command:
    cmd: dpkg --audit
  register: dpkg_audit
  changed_when: false

- name: Repair incomplete APT package installations
  ansible.builtin.command:
    cmd: apt-get --yes --fix-broken install
  register: apt_fix_broken
  changed_when: >-
    '0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.'
    not in apt_fix_broken.stdout
  when: dpkg_audit.stdout | length > 0

- name: Install LLVM development tools
  ansible.builtin.apt:
    name:
      - "clang-{{ llvm_version }}"
      - "clang-format-{{ llvm_version }}"
      - "clangd-{{ llvm_version }}"
      - "clang-tidy-{{ llvm_version }}"
    state: present
    update_cache: true

- name: Link selected clang-format as default
  ansible.builtin.file:
    src: "/usr/bin/clang-format-{{ llvm_version }}"
    dest: /usr/local/bin/clang-format
    state: link
    force: true

# tree-sitter-cli requires the Rust toolchain and LLVM to be present first.
- name: Install tree-sitter CLI through Cargo
  ansible.builtin.command:
    cmd: "{{ dev_home }}/.cargo/bin/cargo install --locked tree-sitter-cli"
    creates: "{{ dev_home }}/.cargo/bin/tree-sitter"
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    PATH: "{{ dev_home }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"

# ---------------- Miniconda ----------------

- name: Check whether Miniconda is installed
  ansible.builtin.stat:
    path: "{{ miniconda_dir }}/bin/conda"
  register: conda_binary

- name: Download Miniconda installer
  ansible.builtin.get_url:
    url: "{{ miniconda_url }}"
    dest: /tmp/Miniconda3-latest-Linux-x86_64.sh
    mode: "0755"
  when: not conda_binary.stat.exists

- name: Install Miniconda
  ansible.builtin.command:
    cmd: "/tmp/Miniconda3-latest-Linux-x86_64.sh -b -p {{ miniconda_dir }}"
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  when: not conda_binary.stat.exists

- name: Check whether Conda initialized bash
  ansible.builtin.command:
    cmd: grep -q ">>> conda initialize >>>" "{{ dev_home }}/.bashrc"
  register: conda_initialized
  changed_when: false
  failed_when: false

- name: Initialize Conda for bash
  ansible.builtin.command:
    cmd: "{{ miniconda_dir }}/bin/conda init bash"
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  when: conda_initialized.rc != 0

# ---------------- GCC 16.2 ----------------

- name: Ensure GCC source directory parent exists
  ansible.builtin.file:
    path: /usr/local/src
    state: directory
    mode: "0755"

- name: Read installed GCC {{ gcc_short_version }} version
  ansible.builtin.command:
    cmd: "/usr/local/bin/gcc-{{ gcc_short_version }} -dumpfullversion"
  register: gcc_version_check
  changed_when: false
  failed_when: false

- name: Determine installed GCC version
  ansible.builtin.set_fact:
    gcc_installed_version: "{{ gcc_version_check.stdout | trim }}"

- name: Download GCC {{ gcc_version }} release source
  ansible.builtin.get_url:
    url: "{{ gcc_url }}"
    dest: "{{ gcc_tarball }}"
    mode: "0644"
  when: gcc_installed_version != gcc_version

- name: Extract GCC source
  ansible.builtin.unarchive:
    src: "{{ gcc_tarball }}"
    dest: /usr/local/src
    remote_src: true
    creates: "{{ gcc_src_dir }}/configure"
  when: gcc_installed_version != gcc_version

- name: Download GCC prerequisite sources
  ansible.builtin.shell: |
    set -euo pipefail
    ./contrib/download_prerequisites
    touch .ansible-prerequisites-complete
  args:
    executable: /bin/bash
    chdir: "{{ gcc_src_dir }}"
    creates: "{{ gcc_src_dir }}/.ansible-prerequisites-complete"
  when: gcc_installed_version != gcc_version

- name: Create out-of-tree GCC build directory
  ansible.builtin.file:
    path: "{{ gcc_build_dir }}"
    state: directory
    mode: "0755"
  when: gcc_installed_version != gcc_version

- name: Configure GCC {{ gcc_version }}
  ansible.builtin.command:
    cmd: >-
      {{ gcc_src_dir }}/configure
      --prefix=/usr/local
      --program-suffix=-{{ gcc_short_version }}
      --disable-multilib
      --enable-languages=c,c++,fortran
      {{ '--disable-bootstrap' if gcc_disable_bootstrap else '' }}
  args:
    chdir: "{{ gcc_build_dir }}"
    creates: "{{ gcc_build_dir }}/Makefile"
  when: gcc_installed_version != gcc_version

- name: Build GCC {{ gcc_version }}
  ansible.builtin.command:
    cmd: "make -j{{ gcc_make_jobs }}"
  args:
    chdir: "{{ gcc_build_dir }}"
  when: gcc_installed_version != gcc_version

- name: Install GCC {{ gcc_version }} side-by-side
  ansible.builtin.command:
    cmd: make install
  args:
    chdir: "{{ gcc_build_dir }}"
  when: gcc_installed_version != gcc_version

- name: Register side-by-side GCC libraries with the dynamic linker
  ansible.builtin.copy:
    dest: "/etc/ld.so.conf.d/gcc-{{ gcc_short_version }}.conf"
    content: |
      /usr/local/lib64
    mode: "0644"

- name: Refresh dynamic linker cache after GCC installation
  ansible.builtin.command: ldconfig
  changed_when: false

- name: Add selected GCC compilers to bashrc
  ansible.builtin.blockinfile:
    path: "{{ dev_home }}/.bashrc"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    marker: "# {mark} ANSIBLE GCC"
    block: |
      export CC=/usr/local/bin/gcc-{{ gcc_short_version }}
      export CXX=/usr/local/bin/g++-{{ gcc_short_version }}
      export FC=/usr/local/bin/gfortran-{{ gcc_short_version }}
