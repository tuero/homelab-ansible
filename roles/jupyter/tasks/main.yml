---
- name: Read JupyterLab environment packages
  ansible.builtin.command:
    cmd: "{{ miniconda_dir }}/bin/conda list -n {{ jupyter_env_name }} --json"
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  register: jupyter_conda_list
  changed_when: false
  failed_when: false

- name: Build installed JupyterLab package map
  ansible.builtin.set_fact:
    jupyter_installed_packages: >-
      {{
        (jupyter_conda_list.stdout | from_json)
        | items2dict(key_name='name', value_name='version')
      }}
  when: jupyter_conda_list.rc == 0

- name: Determine whether JupyterLab environment needs reconciliation
  ansible.builtin.set_fact:
    jupyter_environment_needs_update: >-
      {{
        jupyter_conda_list.rc != 0
        or jupyter_installed_packages.get('python', '') != jupyter_python_version
        or jupyter_installed_packages.get('jupyterlab', '') != jupyterlab_version
        or jupyter_installed_packages.get('ipykernel', '') != jupyter_ipykernel_version
      }}

- name: Create dedicated JupyterLab Conda environment
  ansible.builtin.command:
    cmd: >-
      {{ miniconda_dir }}/bin/conda create --override-channels -c conda-forge
      -n {{ jupyter_env_name }} -y python={{ jupyter_python_version }}
      jupyterlab={{ jupyterlab_version }} ipykernel={{ jupyter_ipykernel_version }}
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  when: jupyter_conda_list.rc != 0
  notify: Restart JupyterLab

- name: Reconcile dedicated JupyterLab Conda environment
  ansible.builtin.command:
    cmd: >-
      {{ miniconda_dir }}/bin/conda install
      --override-channels
      -c conda-forge
      -n {{ jupyter_env_name }}
      -y
      python={{ jupyter_python_version }}
      jupyterlab={{ jupyterlab_version }}
      ipykernel={{ jupyter_ipykernel_version }}
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  when:
    - jupyter_conda_list.rc == 0
    - jupyter_environment_needs_update
  notify: Restart JupyterLab

- name: Ensure Jupyter configuration directory exists
  ansible.builtin.file:
    path: "{{ dev_home }}/.jupyter"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"

- name: Create Jupyter Server configuration
  ansible.builtin.copy:
    dest: "{{ dev_home }}/.jupyter/jupyter_server_config.py"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
    content: |
      c.ServerApp.ip = "0.0.0.0"
      c.ServerApp.port = {{ jupyter_port }}
      c.ServerApp.port_retries = 0
      c.ServerApp.open_browser = False
      c.ServerApp.root_dir = "{{ jupyter_root_dir }}"
      c.PasswordIdentityProvider.hashed_password = "{{ vault_jupyter_password_hash }}"
  no_log: true
  notify: Restart JupyterLab

- name: Create JupyterLab systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/jupyterlab.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=JupyterLab
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ dev_user }}
      Group={{ dev_user }}
      WorkingDirectory={{ dev_home }}
      Environment=HOME={{ dev_home }}
      ExecStart={{ jupyter_env_path }}/bin/jupyter lab
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd
    - Restart JupyterLab

- name: Enable and start JupyterLab
  ansible.builtin.systemd:
    name: jupyterlab
    enabled: true
    state: started
    daemon_reload: true
